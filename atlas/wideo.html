<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Atlas ryb – wideo</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800;900&family=Playfair+Display:ital,wght@0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styl.css">
<script src="sceny.js"></script>
<style>
  body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #scena { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #scena .frame { position: absolute; left: 0; top: 0; margin: 0; display: none; }
  #scena .progress i.teraz { background: rgba(255,255,255,.3); }
</style>
</head>
<body>
<div id="scena"></div>
<script>
// Deterministyczny odtwarzacz: window.ustawCzas(t) ustawia całą klatkę dla czasu t [s].
// Oś czasu (window.OS) buduje narzedzia/os_czasu.py z transkrypcji lektora.
const OS = window.OS, SC = OS.sceny;
const scena = document.getElementById('scena');
scena.innerHTML = window.zbudujSceny().join('') + '<div class="napisy"><div class="linia"></div></div><div class="flash"></div>';
const ramki = [...scena.querySelectorAll('.frame')];
const linia = scena.querySelector('.napisy .linia'), flash = scena.querySelector('.flash');
const UKRYJ_NAPISY = new Set([8]);      // w CTA tekst jest na ekranie
const PRZEJSCIE = 0.32, WEJSCIE = 0.45;

const clamp = (x) => Math.max(0, Math.min(1, x));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeBack = (p) => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const norm = (s) => s.toLowerCase().replace(/[^\wąćęłńóśźż]/g, '');

// przygotowanie: czasy wejść elementów, bazowe transformacje, liczby do nabijania
ramki.forEach((r, i) => {
  r.querySelectorAll('[data-a]').forEach(el => {
    let t0 = parseFloat(el.dataset.d || '0');
    if (el.dataset.przy) {
      const w = SC[i].slowa.find(x => x.n.startsWith(norm(el.dataset.przy)));
      if (w) t0 = Math.max(0, w.s - SC[i].start - 0.08);
    }
    el._t0 = t0;
    const b = getComputedStyle(el).transform;
    el._baza = b === 'none' ? '' : b;
  });
  r.querySelectorAll('[data-licz]').forEach(el => {
    el._cel = el.textContent;
    el._wart = parseFloat(el._cel.replace(',', '.'));
    el._miejsca = (el._cel.split(',')[1] || '').length;
    el._rodzic = el.closest('[data-a]');
  });
});

function animuj(el, lt) {
  const p = clamp((lt - el._t0) / WEJSCIE);
  let tr = '', op = 1;
  switch (el.dataset.a) {
    case 'dol': tr = `translateY(${(1 - easeOut(p)) * 90}px)`; op = clamp(p * 2); break;
    case 'lewo': tr = `translateX(${-(1 - easeOut(p)) * 140}px)`; op = clamp(p * 2); break;
    case 'prawo': tr = `translateX(${(1 - easeOut(p)) * 180}px)`; op = clamp(p * 2); break;
    case 'pop': tr = `scale(${0.5 + 0.5 * easeBack(p)})`; op = clamp(p * 3); break;
    default: op = p;
  }
  el.style.transform = `${tr} ${el._baza}`;
  el.style.opacity = op;
}

window.ustawCzas = function (t) {
  let i = SC.findIndex((s, k) => t >= s.start && (k === SC.length - 1 || t < SC[k + 1].start));
  if (i < 0) i = SC.length - 1;
  const lt = t - SC[i].start, dur = SC[i].end - SC[i].start;
  ramki.forEach((r, k) => {
    const widoczna = k === i || (k === i - 1 && lt < PRZEJSCIE);
    r.style.display = widoczna ? 'block' : 'none';
    r.style.zIndex = k === i ? 2 : 1;
  });
  const r = ramki[i];
  // wejście sceny: lekki zoom i błysk (bez przenikania – poprzednia scena nie prześwituje)
  const pw = i === 0 ? 1 : easeOut(clamp(lt / PRZEJSCIE));
  r.style.opacity = 1;
  r.style.transform = `scale(${1.06 - 0.06 * pw})`;
  flash.style.opacity = i === 0 ? 0 : 0.5 * (1 - clamp(lt / 0.25));
  // Ken Burns – powolny najazd na zdjęcie
  r.querySelectorAll('.kb').forEach(k => k.style.transform = `scale(${1 + 0.07 * clamp(lt / dur)})`);
  // pasek postępu sceny
  const b = r.querySelector('.progress i.teraz b');
  if (b) b.style.width = `${clamp(lt / dur) * 100}%`;
  r.querySelectorAll('[data-a]').forEach(el => animuj(el, lt));
  r.querySelectorAll('[data-licz]').forEach(el => {
    const p = el._rodzic ? clamp((lt - el._rodzic._t0) / 0.9) : 1;
    el.textContent = p >= 1 ? el._cel : (el._wart * easeOut(p)).toFixed(el._miejsca).replace('.', ',');
  });
  // napisy karaoke
  const N = OS.napisy;
  let c = -1;
  for (let k = 0; k < N.length; k++) if (N[k].s - 0.05 <= t) c = k;
  // w hooku duży tekst już jest na ekranie – napisy dopiero od kolejnego zdania
  const poHooku = i > 0 || t >= (SC[0].slowa.find(w => w.n === norm(window.GATUNEK.hook.napisy_od || '')) || { s: 0 }).s - 0.05;
  const aktywna = c >= 0 && poHooku && !UKRYJ_NAPISY.has(i) && (t < N[c].e + 0.5 || (N[c + 1] && t < N[c + 1].s));
  if (aktywna) {
    const L = N[c];
    const wk = L.slowa.reduce((acc, w, k) => (w.s - 0.03 <= t ? k : acc), 0);
    const pl = clamp((t - L.s + 0.05) / 0.12);
    linia.style.transform = `scale(${0.85 + 0.15 * easeBack(pl)})`;
    linia.innerHTML = L.slowa.map((w, k) => `<span class="w ${k === wk ? 'on' : ''}">${w.t}</span>`).join('');
    linia.style.display = '';
  } else linia.style.display = 'none';
};
window.gotowe = Promise.all([document.fonts.ready, ...[...document.images].map(im => im.decode().catch(() => {}))]);
</script>
</body>
</html>
