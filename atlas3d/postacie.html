<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Karta postaci</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; overflow: hidden; background: #efe8d8; font-family: Inter, sans-serif; color: #241726; }
  canvas { position: absolute; inset: 0; }
  .t { position: absolute; font: 900 26px Inter; letter-spacing: 1px; transform: translateX(-50%); white-space: nowrap; }
  h1 { position: absolute; left: 50px; top: 30px; font: 400 64px Anton; text-transform: uppercase; }
  h1 small { font: 700 24px Inter; margin-left: 16px; text-transform: none; opacity: .7; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<h1>Karta postaci <small>Wiśnia Wędkuje · okoń, płoć i wędkarz „Ekspert” (atlas3d/postacie.js)</small></h1>
<div id="ui"></div>
<script type="module">
// Karta postaci (character + expression sheet) z tej samej biblioteki, której używają sceny.
import * as THREE from 'three';
import { stworzOkonia, stworzWedkarza, stworzPlotke, POSTACIE } from './postacie.js';
const W = 1920, H = 1080;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; document.body.prepend(r.domElement);
const sc = new THREE.Scene(), cam = new THREE.OrthographicCamera(0, W, H, 0, -10, 10); cam.layers.enable(POSTACIE);
const ui = document.getElementById('ui'); let html = '';
const dodaj = (g, x, y, podpis, dy = 18) => { g.position.set(x, H - y, 0); sc.add(g); html += `<div class="t" style="left:${x}px;top:${y + dy}px">${podpis}</div>`; return g; };
const okony = [['spokojny', 'okoń – spokojny'], ['czujny', 'czujny / atak'], ['zdziwiony', 'zdziwiony']].map(([m, p], i) => {
  const o = stworzOkonia({ wys: i ? 230 : 380, mina: m }); return [dodaj(o, i ? 1120 + (i - 1) * 470 : 420, i ? 300 : 360, p, i ? 120 : 190), m]; });
const pl = dodaj(stworzPlotke({ wys: 110 }), 1580, 500, 'płoć (drobnica)', 60);
const wedk = [['spokojny', 'Ekspert – spokojny'], ['usmiech', 'uśmiech'], ['zdziwiony', 'zdziwienie'], ['skupiony', 'skupienie']].map(([m, p], i) =>
  [dodaj(stworzWedkarza({ wys: 470 }), 170 + i * 330, 1030, p), m]);
const zima = dodaj(stworzWedkarza({ wys: 470, zima: true }), 1520, 1030, 'zima (ta sama twarz)');
const siedzi = dodaj(stworzWedkarza({ wys: 470, zima: true, siedzi: true }), 1800, 1030, 'na lodzie');
ui.innerHTML = html;
window.klatka = t => {
  okony.forEach(([o, m], i) => o.userData.okon.anim(t + i, { mina: m, tempo: m === 'czujny' ? 2 : 1 }));
  pl.userData.okon.anim(t);
  wedk.forEach(([w, m], i) => w.userData.wedkarz.anim(t + i * .3, { mina: m, podrywanie: m === 'skupiony' }));
  zima.userData.wedkarz.anim(t, {}); siedzi.userData.wedkarz.anim(t, { podrywanie: true });
  r.render(sc, cam);
};
window.klatka(.4); window.gotowe = true;
</script>
</body>
</html>
