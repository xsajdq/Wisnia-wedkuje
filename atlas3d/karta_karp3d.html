<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Karta płoci i uklei 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; overflow: hidden; background: #efe8d8; font-family: Inter, sans-serif; color: #241726; }
  canvas { position: absolute; inset: 0; }
  .t { position: absolute; font: 900 22px Inter; transform: translateX(-50%); white-space: nowrap; }
  h1 { position: absolute; left: 40px; top: 20px; font: 400 54px Anton; text-transform: uppercase; }
  h1 small { font: 700 22px Inter; margin-left: 14px; text-transform: none; opacity: .7; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<h1>Płoć i ukleja 3D <small>bryły (stworzPlotke3D, stworzUkleje3D) i dotychczasowe rysunki 2D</small></h1>
<div id="ui"></div>
<script type="module">
// Karta kontrolna: node atlas3d/render_karta.mjs karta_karp3d [--animacja]
import * as THREE from 'three';
import { stworzPlotke, stworzUkleje, stworzPlotke3D, stworzUkleje3D } from './postacie.js';
const W = 1920, H = 1080;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; document.body.prepend(r.domElement);
const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, W / H, 10, 10000); cam.position.set(W / 2, H / 2, 2000); cam.lookAt(W / 2, H / 2, 0); cam.layers.enableAll();
sc.add(new THREE.HemisphereLight('#dcecff', '#a08a68', 1.15)); const sun = new THREE.DirectionalLight('#fff3e0', 2.8); sun.position.set(300, 1450, 1600); sc.add(sun);
let html = ''; const anim = [];
const dodaj = (g, x, y, ry, rx, podpis, dy) => { const p = new THREE.Group(); p.add(g); p.position.set(x, H - y, 0); p.rotation.set(rx, ry, 0); sc.add(p); html += `<div class="t" style="left:${x}px;top:${y + dy}px">${podpis}</div>`; anim.push(t => g.userData.okon.anim(t)); };
dodaj(stworzPlotke3D({ wys: 230 }), 330, 300, 0, 0, 'płoć 3D – bok', 150);
dodaj(stworzPlotke3D({ wys: 230 }), 960, 300, -.75, 0, 'płoć 3D – 3/4', 150);
dodaj(stworzPlotke({ wys: 230 }), 1590, 300, 0, 0, 'płoć 2D', 150);
dodaj(stworzUkleje3D({ wys: 170 }), 330, 760, 0, 0, 'ukleja 3D – bok', 130);
dodaj(stworzUkleje3D({ wys: 170 }), 960, 760, -.75, .3, 'ukleja 3D – 3/4 z góry', 130);
dodaj(stworzUkleje({ wys: 170 }), 1590, 760, 0, 0, 'ukleja 2D', 130);
document.getElementById('ui').innerHTML = html;
window.klatka = t => { anim.forEach(f => f(t)); r.render(sc, cam); };
window.klatka(.4); window.gotowe = true;
</script>
</body>
</html>
