  babelki(); mul(); promienie(5, .22); rdestnice(-1.8, 5.6, 1.2);

  return `<h1 data-od=".2"><span>Szczupak</span></h1>`; } }, liczba: 1, tytul: 'ATLAS <b>3D</b>', dlugosc: () => 3 });
