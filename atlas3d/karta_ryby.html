<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Karta ryb</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; overflow: hidden; background: #efe8d8; font-family: Inter, sans-serif; color: #241726; }
  canvas { position: absolute; inset: 0; }
  .t { position: absolute; font: 900 20px Inter; transform: translateX(-50%); white-space: nowrap; }
  h1 { position: absolute; left: 40px; top: 20px; font: 400 54px Anton; text-transform: uppercase; }
  h1 small { font: 700 22px Inter; margin-left: 14px; text-transform: none; opacity: .7; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<h1>Karta ryb <small>porównanie jakości: okoń, płoć, ukleja (postacie.js)</small></h1>
<div id="ui"></div>
<script type="module">
// Każdy obiekt pokazany w kilku obrotach (bok, 3/4, z góry, z tyłu), w świetle jak w scenie LATO.
import * as THREE from 'three';
import { stworzOkonia, stworzWedkarza, stworzPlotke, stworzUkleje, POSTACIE } from './postacie.js';
import { PRZYNETY } from './przynety.js';
const W = 1920, H = 1080;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; document.body.prepend(r.domElement);
const sc = new THREE.Scene(), cam = new THREE.OrthographicCamera(0, W, H, 0, -2000, 2000); cam.layers.enableAll();
sc.add(new THREE.HemisphereLight('#dcecff', '#a08a68', 1.15)); const sun = new THREE.DirectionalLight('#fff3e0', 2.8); sun.position.set(300, 450, 600); sc.add(sun);
const ui = document.getElementById('ui'); let html = '';
const anim = [];
// obiekt w obrocie: ry – obrót wokół pionu (0 = bok), rx – pochylenie (widok z góry)
const dodaj = (g, x, y, ry, rx, podpis, dy = 16) => { const p = new THREE.Group(); p.add(g); p.position.set(x, H - y, 0); p.rotation.set(rx, ry, 0); sc.add(p); if (podpis) html += `<div class="t" style="left:${x}px;top:${y + dy}px">${podpis}</div>`; return g; };
[[stworzOkonia, 'okoń', 300, 430, 330], [stworzPlotke, 'płoć', 1350, 300, 380], [stworzUkleje, 'ukleja', 1350, 760, 380]].forEach(([f, n, x, y, w]) => { const o = f({ wys: w }); dodaj(o, x, y, 0, 0, n, w * .55); anim.push(t => o.userData.okon.anim(t)); });
[[stworzPlotke, 'płoć 3/4', 300, 860], [stworzUkleje, 'ukleja 3/4', 760, 860]].forEach(([f, n, x, y]) => { const o = f({ wys: 260 }); dodaj(o, x, y, .7, -.15, n, 90); anim.push(t => o.userData.okon.anim(t)); });
ui.innerHTML = html;
window.klatka = t => { anim.forEach(f => f(t)); r.render(sc, cam); };
window.klatka(.4); window.gotowe = true;
</script>
</body>
</html>
