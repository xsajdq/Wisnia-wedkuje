const SCENY = {
  1: () => { // HOOK: rzut w pustą wodę (✗ bez stanowiska) → kamera płynie do zatopionego drzewa z okoniami (✓ stanowisko)

    for (let i = 0; i < 9; i++) { const x0 = -1.6 + (i % 5) * .45, y0 = -.35 - Math.floor(i / 5) * .22, z0 = 9.4 - (i % 3) * .3;

    const o = postaw(okon(.7, { mina: 'czujny' }), -3.2, -1.6, 8.6); o.userData.ruch = t => ({ x: -3.2 + 2.6 * sm((t - 3.3) / 1.4) + .05 * t, y: -1.6 + .7 * sm((t - 3.3) / 1.4) });

  7: () => { // RZEKA: główka → filar mostu → podmyty brzeg i kamień → granica nurtu (każde miejsce osobno, po 4–6 s)
    nowaScena({ ...LATO, seed: 21, wodaK: .042 }); swiatRzeka({ podmycia: [{ z0: -5.5, z1: 1.5, strona: -1, wysun: 1.5 }] });
    const zg = 0, xg = rzekaX(zg) + 9.4; glowka(xg, zg, 5.2, -1);
    most(-7); const xf = rzekaX(-7) + 4.5;
    for (const [x, z, sc] of [[-2, 4, 1.1], [.8, 6.5, .9], [-1.2, 9.5, 1.3]]) kamien(x, z, sc);
    rdestnice(6, 6, 1.6); rogatki(-6.5, 5); rdestnice(-7.4, 2.4, 1.3); palki(xg + .8, -3.4, 8, .6); rdestPlat(-8.4, 8, 10, 2.4);
    const C = [2.2, 0, 18], xb = brzegX(-2, -1);
    kam(C, [5, -1, 0], { stalaY: 0, fov: 58, klucze: [[0, C, [5.5, -.8, 0]], [5.2, C, [5.5, -.8, 0]], [6.6, C, [-.8, 0, -7]], [9.8, C, [-.8, 0, -7]], [11.2, [xb + 4.4, 0, 4.6], [xb + .3, -.35, -2]], [14.6, [xb + 4.2, 0, 4.2], [xb + .3, -.35, -2]], [15.8, C, [1.4, -1, 3]], [21, C, [1.4, -1, 3]]] });
    babelki(30); mul(420, '#d9cfa8', 2.4); promienie(5, .16);
    nurtLinia(-12, 14, { x: -.3, y: -.35, od: 15.6 });
    plyw(postaw(okon(.62, { lewo: true, mina: 'czujny' }), 4.3, -1.3, 2.4), { dx: .3, okres: 5 });
    plyw(postaw(okon(.5, { lewo: true }), xf - .2, -1.7, -5), { dx: .25, okres: 6 });
    plyw(postaw(okon(.42, { lewo: true }), xb - .35, -.6, -2.4), { dx: .2, okres: 7 });
    plyw(postaw(okon(.45), -2.3, -2.3, 5.1), { dx: .3, okres: 6, faza: 1 });
    wskaz('główka', xg - 2.6, .3, zg, -40, -170, 'z', .9, 5.4); wskaz('okoń za główką', 4.3, -1.3, 2.4, -170, 120, 'n', 2.2, 5.4);
    wskaz('filar mostu', xf - .4, .9, -5.7, 130, -150, 'z', 6.8, 10); wskaz('okoń przy filarze', xf - .2, -1.7, -5, -150, 120, 'n', 7.6, 10);
    wskaz('podmyty brzeg', xb + .1, .3, -1.4, 170, -230, 'z', 11.2, 15.2); wskaz('okoń w jaskini', xb - .35, -.6, -2.4, 210, 160, 'n', 12, 15.2);
    wskaz('główny nurt', rzekaX(9) - .3, -.35, 9, 150, -110, 'c', 16); wToni(); wskaz('granica nurtu', 3.6, -1, 2.4, 120, 140, 'z', 16.8); wToni();
    return `<h1 data-od=".4"><span>Rzeka</span></h1>
      <div class="karta mala" style="top:1440px" data-od="17.6">Prowadź przynętę<small>tak, żeby przeszła przez stanowisko ryby</small></div>`;
  },
  8: () => { // SPRZĘT: wędkarz na pomoście, zestaw wyskakuje kolejno (każdy element ≥ 3 s)
    nowaScena({ ...LATO, seed: 13 }); swiatJezioro(); pomost(PX, -26, -3);
    kam([-3.6, 1.6, 4.2], [-3.9, 1.45, -3.6], { najazd: [0, .04], orbita: .03 });
    kregi(4); wazka(-5.6, 2.6, -2);
    postaw(wedkarz(1.9, { st: { mina: 'usmiech' } }), PX, .65, -3.6);
    const z = 1.2, X = -3.3, el = (g, x, y, od, st) => pokaz(postaw(element(g, st), x, y, z), od);
    el(SPRZET.wedka({ dl: 1.05 }), -3.5, 1.92, 1.2);
    el(SPRZET.kolowrotek({ dl: .3 }), X - .16, 1.57, 4.6, { obroty: 1 }); el(SPRZET.plecionka({ dl: .22 }), X + .22, 1.57, 7.2);
    el(SPRZET.przypon({ dl: .52 }), X, 1.3, 8.6);
    el(PRZYNETY.twister({ dl: .26 }), X - .15, 1.03, 10.6, { predkosc: .6 }); el(PRZYNETY.ripper({ dl: .26 }), X + .17, 1.03, 11, { predkosc: .6 });
    el(PRZYNETY.obrotowka({ dl: .28 }), X - .15, .76, 13.2, { predkosc: .5 }); el(PRZYNETY.wobler({ dl: .26 }), X + .17, .76, 13.6, { predkosc: .6 });
    etykieta('wędka 2–10 g', -3.75, 2.04, z, 'z', 1.8); etykieta('kołowrotek 1000–2500', X, 1.76, z, 'z', 5); etykieta('plecionka + przypon', X, 1.42, z, '', 7.6);
    etykieta('guma 4–7 cm na główce', X, 1.16, z, 'z', 11.2); etykieta('obrotówki i woblery', X, .9, z, '', 13.8);
    return `<div class="chip" data-od=".2">🎒 SPRZĘT</div><h1 data-od=".5">Lekki<br><span>spinning</span></h1>`;
  },
  9: () => { // PROWADZENIE: tor gumy nad górką – opad, podbicie, opad; okoń płynie za gumą
    GORKA();
    kam([-1, 0, 14.5], [-1.8, -1.7, 6], { najazd: [0, .1], orbita: .06, stalaY: 0 });
    babelki(); mul(); promienie(6, .24); rdestnice(1.6, 9.6); rogatki(-4.6, 9.2);

    const tor = sciezka([[-.3, -.15, zt], [-.5, b(-.5), zt], [-.9, b(-.9) + 1.1, zt], [-1.3, b(-1.3), zt], [-1.7, b(-1.7) + 1, zt], [-2.1, b(-2.1), zt], [-2.5, b(-2.5) + 1.1, zt], [-2.95, b(-2.95) + .2, zt]], { kolor: '#ffd400' });
    const ruch = t => .82 * sm((t - .3) / 9.7);
    anim.push(t => tor.ustaw(ruch(t) + .01));
    const w = postaw(wedkarz(1.9, { st: { mina: 'skupiony', podrywanie: true } }), PX, .65, -3.6);
    const o = postaw(okon(.62, { mina: 'czujny' }), .4, -1.5, 8.6); o.userData.ruch = t => { const p = tor.punkt(ruch(t)); return { x: lerp(.4, p.x + .9, sm((t - 3) / 4)), y: lerp(-1.5, p.y - .1, sm((t - 3) / 4)) }; };
    zylka(w, t => { const p = tor.punkt(ruch(t)); return [p.x, p.y, p.z]; }, false, { typ: 'ripper', dl: .55 });
    etykieta('1. opad', -.6, b(-.6) + 1.5, zt, 'z', 1, 6.5); etykieta('2. podbicie', -1, b(-1) + 1.8, zt, 'z', 3.6, 9.5);
    return `<div class="chip" data-od=".2">🎯 PROWADZENIE</div><h1 data-od=".5">Opad<br><span>i podbicie</span></h1>
      <div class="karta mala" style="top:560px" data-od="6.6">Kontroluj linkę<small>branie często na opadzie</small></div>`;
  },
  10: () => { // BRANIE I HOL: okoń atakuje na opadzie i połyka gumę → kamera pół na pół: wędkarz holuje (wędka wygięta, hamulec), okoń walczy i podchodzi pod pomost → wyjęcie ryby
    GORKA();
    const BR = 4.6, LAD = 12.4, zt = 8, b = x => lezy(x, zt, .3);
    kam([-1, 0, 14.5], [-1.8, -1.7, 6], { stalaY: 0, klucze: [[0, [-1.4, 0, 13.6], [-2.4, -1.6, 6.4]], [5.2, [-1.6, 0, 13.4], [-2.6, -1.6, 6.4]], [6.6, [3.4, 0, 11], [-2.4, -.7, 6]],
      [10.6, [2.4, 0, 4.2], [-4, -.2, -1]], [12.2, [1.6, 0, 2.4], [-4.6, .55, -3]], [15, [1.5, 0, 2.2], [-4.6, .6, -3.1]]] });
    babelki(); mul(); promienie(6, .24); rdestnice(1.6, 9.6);
    const tor = sciezka([[-.3, -.15, zt], [-.5, b(-.5), zt], [-.9, b(-.9) + 1.1, zt], [-1.3, b(-1.3), zt], [-1.7, b(-1.7) + 1, zt], [-2.1, b(-2.1), zt], [-2.5, b(-2.5) + 1.1, zt], [-2.95, b(-2.95) + .2, zt]], { kolor: '#ffd400' });
    const ruch = t => .82 + .18 * sm(t / BR);
    anim.push(t => tor.ustaw(Math.min(ruch(t), 1) + .01));
    const w = postaw(wedkarz(1.9, { st: { mina: 'skupiony' } }), PX, .65, -3.6);
    const P0 = tor.punkt(1), Q = new THREE.Vector3(PX + .7, -.45, -2.6);
    const zryw = (t, t0) => Math.exp(-(((t - t0) / .45) ** 2));                          // odjazd ryby (hamulec oddaje linkę)
    const o = postaw(okon(.6, { mina: 'czujny' }), .6, -1.4, 8.4);
    o.userData.ruch = t => {
      if (t < BR) { const p = tor.punkt(ruch(t)), a = sm((t - 1.4) / 2.6); return { x: lerp(.6, p.x + .35, a), y: lerp(-1.4, p.y, a) }; }
      if (t < LAD) { const k = Math.max(0, Math.min(1, sm((t - BR - .3) / (LAD - BR - .6)) - .1 * zryw(t, 6.6) - .1 * zryw(t, 8.8)));
        return { x: lerp(P0.x + .35, Q.x, k) + .12 * Math.sin(t * 7), y: lerp(P0.y, Q.y, k) + .08 * Math.sin(t * 5.3), z: lerp(zt, Q.z, k) }; }
      w.updateMatrixWorld(true); const d = w.userData.postac.dlon(); return { x: d.x + .25, y: d.y + .05, z: d.z }; };
    // stan wędkarza ustawiany w jego ruch(t) – liczy się przed animacją postaci i przed rybą (bez opóźnienia o klatkę)
    w.userData.ruch = t => { const st = w.userData.postac.st, wyj = t >= LAD; st.hol = t >= BR && !wyj; st.trzyma = wyj; st.mina = wyj ? 'usmiech' : 'skupiony'; o.userData.bezKolizji = wyj; return {}; };
    zylka(w, t => { const p = tor.punkt(Math.min(ruch(t), 1)); return [p.x, p.y, p.z]; }, false, { typ: 'ripper', dl: .55, branie: { od: BR, ryba: o } });
    anim.push(t => { w.userData.postac.st.hol = t >= BR && t < LAD; });
