  pomost, postaw, etykieta, wskaz, plyw, kamien, babelki, mul, promienie, kregi, wazka, zylka, przedplan, kam, zatopioneDrzewo, glowka, most,

// czasy scen (s) – z liczby słów lektora v2 + zapas na pokazanie miejsca (min. 2,5 s na etykietę)
const DLUGOSCI = [10, 6.5, 5, 6.5, 4.5, 10, 8, 16, 21, 11, 21, 10.5, 17.5, 8, 25, 10.5, 7, 19];
const lezy = (x, z, nad = .2) => TEREN(x, z) + nad;
// grzybienie odsunięte od trzcin – rośliny nie wchodzą w siebie
const JEZIORO = () => { nowaScena({ ...LATO, seed: 9 }); swiatJezioro({ gorka: { x: 1, z: 4, r: 4, top: -2.1 } }); pomost(PX, -26, -3);
  trzciny(-11.9, -18.7, 18, 1); trzciny(-5.2, -20.8, 14, 1.2); palki(-14.6, -18.8, 10, .9); palki(-2.5, -21.4, 8, .8);   // trzciny i pałki w wodzie (ok. 0,2–0,6 m), nie na brzegu
  grzybienie(-8.6, -17.6, 9, 3.2); grazele(-1.5, -19.5, 6, 3); rdestPlat(4.5, -19, 14, 3.4); rdestnice(-1.5, 11.5); rogatki(2.4, 10.8); rdestnice(-3.4, 9.8, 1.4); };
const GORKA = () => { nowaScena({ ...LATO, seed: 31 }); swiatJezioro({ gorka: { x: -2, z: 7.6, r: 4.5, top: -2.6 } }); pomost(PX, -26, -3); };

// ---------- synchronizacja z lektorem v2 (audio/okon_jak2/transkrypcja.json, czasy po przyspieszeniu ×1,1) ----------
const SLOWA = await fetch('/audio/okon_jak2/transkrypcja.json').then(r => r.ok ? r.json() : null).then(d => d?.words || null).catch(() => null);
const START_STARE = [['wybierasz'], ['na', 'jeziorze'], ['sprawdź', 'też', 'pomosty'], ['szukaj', 'podwodnych'], ['dobre', 'są'], ['obserwuj', 'ławice'], ['na', 'rzece'],

const KOTWICE_STARE = {

  10: [[1, 'opadu'], [3.6, 'podbicia'], [6.6, 'kontroluj'], [10.2, 'ciężar'], [12.9, 'jest'], [15.6, 'holuj'], [17.8, 'hamulec']],
  11: [[.9, 'odprowadzają'], [2.2, 'zwolnij'], [2.9, 'wydłuż'], [3.6, 'zmniejsz'], [6.2, 'drop'], [7.6, 'robaka']],
  12: [[1.4, 'grupach'], [2.2, 'obłów'], [4.4, 'rzuty'], [5.8, 'kolejne']],

// kolejność scen v3: stare sceny (numer w nagraniu v2) i nowe (null – czekają na nagranie fragmentów lektora)
const UKLAD = [1, 2, 3, 4, 5, 6, null, null, 7, null, 8, 9, null, null, 10, 11, 12, 13];
const START = UKLAD.map(n => n ? START_STARE[n - 1] : null), KOTWICE = Object.fromEntries(UKLAD.map((n, i) => [i + 1, n ? KOTWICE_STARE[n] : []]));
const CZAS = (() => { if (!SLOWA || START.some(x => !x)) return null;
  const nz = s => s.toLowerCase().replace(/[^a-ząćęłńóśźż]/g, ''), W = SLOWA.map(w => ({ ...w, n: nz(w.text) })).filter(w => w.n);
  const znajdz = (seq, od) => { for (let i = od; i < W.length; i++) if (seq.every((x, k) => W[i + k]?.n === x)) return i; throw new Error('brak: ' + seq.join(' ')); };
  const idx = []; let k = 0; for (const s of START) { k = znajdz(s, k); idx.push(k); k++; }
  const st = idx.map((i, n) => n ? W[i].start - .3 : 0), konc = W[W.length - 1].end + 2.5, wyn = {};
  for (let n = 1; n <= START.length; n++) { const S = st[n - 1], E = n < START.length ? st[n] : konc, kot = []; let j = idx[n - 1];
    for (const [p, slowo] of KOTWICE[n]) { while (j < W.length && !W[j].n.startsWith(nz(slowo))) j++; if (j >= W.length) throw new Error(`scena ${n}: brak słowa ${slowo}`); kot.push([W[j].start - S, p]); j++; }
    wyn[n] = { dl: E - S, kotwice: kot }; }
  return wyn; })();

const SCENY = {
  1: () => { // HOOK: rzut w pustą wodę (✗ bez stanowiska) → kamera płynie do zatopionego drzewa z okoniami (✓ stanowisko)
    nowaScena({ ...LATO, seed: 5 }); swiatJezioro({ bezKonarow: true }); pomost(-13, -22, -2); zatopioneDrzewo(-20, 4, .46, 9);
    kam([-9, 0, 18], [-5, -1.4, 6], { stalaY: 0, fov: 52, klucze: [[0, [-9, 0, 18], [-5, -1.4, 6]], [3.4, [-8.6, 0, 17.4], [-5, -1.4, 6]], [5.6, [-11, 0, 16], [-14.5, -1.2, 6.5]], [10, [-11.4, 0, 15.4], [-14.5, -1.2, 6.5]]] });
    babelki(); mul(); promienie(); przedplan(3);
    const w = postaw(wedkarz(1.9, { st: { mina: 'skupiony' } }), -13, .65, -2.6);
    anim.push(t => { w.userData.postac.st.rzut = sm((t - .2) / 1.3); });
    dzwiek(.7, 'rzut', .8); dzwiek(1.5, 'plusk', .45);
    zylka(w, t => { const k = sm((t - .9) / .6); if (k < 1) { const a = w.userData.postac.czubek(); return [lerp(a.x, -5.2, k), lerp(a.y, 0, k) + 2.2 * Math.sin(Math.PI * k), lerp(a.z, 6.5, k)]; }
      return [-5.2 + .1 * (t - 1.5), -1.5 * sm((t - 1.5) / 2), 6.5]; }, false, { typ: 'twister', dl: .42 });
    const st = [[-13.2, -1.2, 9.5, .7], [-11.8, -1.5, 8.6, .55], [-14.6, -1.3, 8.2, .5]].map(([x, y, z, dl]) => plyw(postaw(okon(dl, { mina: 'czujny' }), x, y, z), { dx: .5, okres: 6, faza: x }));
    wskaz('✗ bez stanowiska', -5.05, -1.3, 6.5, 0, -170, 'c', 2.2, 4.2); wToni();   // przynęta w pustej wodzie – celowo w toni
    wskaz('✓ stanowisko', 0, 0, 0, 150, -160, 'z', 5.8); przypnij(st[0], [0, .25, 0]);
    return `<div class="chip" data-od="6.4">🎣 PORADNIK</div><h1 data-od="6.6">Jak łowić<br><span>okonie?</span></h1><div class="opis" style="top:520px" data-od="7.6">Gdzie i na jakie przynęty<small>🐟 okoń to drapieżnik – łowimy go głównie na spinning, ale też na spławik i czasem na grunt</small></div>`;
  },
  2: () => { // JEZIORO 1: granica roślinności – trzciny i grzybienie z bliska, okoń pod liśćmi
    JEZIORO(); wazka(-8.2, .7, -16.6); dzwiek(.5, 'wazka', .7); dzwiek(3.6, 'wazka', .5);
    kam([-6.6, 1.8, -12.6], [-10.2, .2, -18.4], { klucze: [[0, [-6.2, 2.2, -11.8], [-10.2, .2, -18.4]], [6.5, [-7, 1.6, -12.9], [-10.3, .2, -18.6]]] });
    const o = plyw(postaw(okon(.5, { mina: 'czujny', lewo: true }), -8.4, -.5, -16.8), { dx: .3, okres: 6 });
    wskaz('trzciny', -11.9, 1.2, -18.7, 60, -170, 'z', .9); wskaz('grzybienie', -8.6, .03, -17.6, -40, 160, '', 1.5);
    wskaz('okoń pod liśćmi', 0, 0, 0, 160, 120, 'n', 3.2); przypnij(o, [0, .15, 0]);
    return `<h1 data-od=".3"><span>Jezioro</span></h1>`;
  },
  3: () => { // JEZIORO 2: pod pomostem – okonie w cieniu pali
    JEZIORO();
    kam([PX + 3.4, 0, -9.6], [PX - .2, -1.1, -14.2], { stalaY: 0, najazd: [0, .06], orbita: .05, fov: 52 });
    babelki(); mul(); promienie(4, .2);
    const st = [[PX - .3, -1.1, -13.4, .5], [PX + .4, -1.5, -14.6, .45], [PX - .2, -1.8, -15.4, .4]].map(([x, y, z, dl], i) => plyw(postaw(okon(dl, { lewo: i % 2 === 1 }), x, y, z), { dx: .25, okres: 7, faza: i * 2 }));
    wskaz('pomost', PX + .75, .45, -12.4, 140, -150, 'z', .4); wskaz('okonie w cieniu pali', 0, 0, 0, 150, 160, 'n', 1.4); przypnij(st[0], [0, .2, 0]);
    return `<h1 data-od=".1"><span>Jezioro</span></h1>`;
  },
  4: () => { // JEZIORO 3: przelot pod wodą nad górką i nad spadem
    JEZIORO();
    kam([-2.6, -.5, 12.5], [1, -2.2, 4], { stalaY: 0, klucze: [[0, [-2.6, 0, 12.5], [1, -2.2, 4]], [3, [-1.4, 0, 11.2], [1.6, -2.4, 4]], [6.5, [-.2, 0, 10.4], [3.2, -3.4, 3]]] });
    babelki(); mul(); promienie(5, .22);
    plyw(postaw(okon(.5, { lewo: true }), 1.4, -1.6, 5.2), { dx: .5, okres: 7 }); plyw(postaw(okon(.55), 3.4, -3.2, 3.4), { dx: .5, okres: 8, faza: 2 });
    wskaz('górka', 1, lezy(1, 4, .05), 4, 170, 90, 'z', .8); wskaz('spad', 2.2, lezy(2.2, 6, .05), 6, 60, 170, 'c', 3.2);
    return `<h1 data-od=".1"><span>Jezioro</span></h1>`;
  },
  5: () => { // JEZIORO 4: zatopione drzewo z gałęziami
    nowaScena({ ...LATO, seed: 5 }); swiatJezioro({ bezKonarow: true }); pomost(-13, -22, -2); zatopioneDrzewo(-20, 4, .46, 9);
    kam([-15.2, 0, 13.2], [-16.4, -1.3, 6.2], { stalaY: 0, najazd: [0, .08], orbita: -.06, fov: 52 });
    babelki(); mul(); promienie();
    plyw(postaw(okon(.55, { mina: 'czujny' }), -15.2, -1.2, 7.4), { dx: .4, okres: 6 }); plyw(postaw(okon(.45, { lewo: true }), -17, -1.5, 6.6), { dx: .3, okres: 7 });
    wskaz('zatopione drzewo', -15.9, lezy(-15.9, 6, .45), 6, -130, -170, 'z', .6);
    return `<h1 data-od=".1"><span>Jezioro</span></h1>`;
  },
  6: () => { // JEZIORO 5: ławica drobnicy ucieka przy powierzchni, okoń poluje w toni
    JEZIORO();
    kam([.5, 0, 15], [.5, -2.2, 3], { stalaY: 0, najazd: [0, .06], orbita: .04 });
    babelki(); mul(); promienie(7, .24);
    const lawica = [];
    for (let i = 0; i < 9; i++) { const x0 = -1.6 + (i % 5) * .45, y0 = -.35 - Math.floor(i / 5) * .22, z0 = 9.4 - (i % 3) * .3;
      const p = postaw((i % 4 === 3 ? plotka : ukleja)(.2), x0, y0, z0); lawica.push(p); p.userData.ruch = t => ({ x: x0 + 3.2 * sm((t - 3.6 - i * .03) / 1.2) + .08 * Math.sin(t * 3 + i) }); }
    const o = postaw(okon(.7, { mina: 'czujny' }), -3.2, -1.6, 8.6); o.userData.ruch = t => ({ x: -3.2 + 2.6 * sm((t - 3.3) / 1.4) + .05 * t, y: -1.6 + .7 * sm((t - 3.3) / 1.4) });
    dzwiek(3.6, 'lawica', .8);
    wskaz('ławica drobnicy', 0, 0, 0, -60, -120, '', .8, 4.4); przypnij(lawica[2], [0, .05, 0]);
    wskaz('okoń poluje w toni', 0, 0, 0, -150, 160, 'n', 6.2); przypnij(o, [0, .2, 0]);
    return `<h1 data-od=".1"><span>Jezioro</span></h1>`;
  },
  7: () => { // PTAKI NAD WODĄ: mewy krążą i nurkują w jednym miejscu – tam jest drobnica, a pod nią może polować okoń
    JEZIORO();
    kam([.6, .15, 10.6], [.8, .5, 6.2], { stalaY: 0, najazd: [0, .04], orbita: .03, fov: 54 });
    kregi(3);
    const m = mewy(1.6, 5.4, 3, { r: 1.25, wys: 1.6, nurki: [[2.6, 1.2, 6.6], [5.2, .2, 5.8]] });
    for (let i = 0; i < 6; i++) { const x0 = .2 + (i % 3) * .5, z0 = 6.8 + Math.floor(i / 3) * .4; const p = postaw(ukleja(.24), x0, -.35, z0); p.userData.ruch = t => ({ x: x0 + .5 * Math.sin(t * 1.4 + i), y: -.3 + .05 * Math.sin(t * 3 + i) }); }
    wskaz('mewy nurkują w jednym miejscu', 0, 0, 0, -380, -40, 'z', .6, 3); przypnij(m[0], [0, .15, 0]);
    wskaz('pod nimi drobnica', .7, -.35, 6.8, -300, 90, 'n', 3.4); const ok = plyw(postaw(okon(.45, { mina: 'czujny' }), 1, -.72, 7.6), { dx: .25, okres: 5 }); wskaz('i poluje okoń', 0, 0, 0, -390, 0, 'c', 4.6); przypnij(ok, [0, .15, 0]);
    return `<h1 data-od=".1"><span>Jezioro</span></h1><div class="karta mala" style="top:1770px" data-od="4">Patrz na ptaki<small>mewy i rybitwy zdradzają ławicę drobnicy</small></div>`;
  },
  8: () => { // DUŻY OKOŃ: małe okonie w dużym stadzie na płyciźnie → kamera schodzi na spad: duże pojedynczo, głębiej → jeden duży wchodzi na płyciznę („ale nie zawsze”)
    JEZIORO(); rdestnice(-17, 5.2, 1.1); rogatki(-15.4, 7, 1);
    kam([-13, -.4, 11.5], [-16, -.9, 6], { stalaY: 0, klucze: [[0, [-13, -.4, 11.5], [-16, -.9, 6]], [4.2, [-12.6, -.5, 11.2], [-15.6, -1, 6]], [6, [-11.4, -1.2, 12], [-7.4, -4.6, 6.3]], [9.4, [-11.6, -1.2, 12.2], [-7.6, -4.6, 6.3]],
      [11.4, [-12.4, -.8, 12], [-11.5, -2.4, 6.6]], [16, [-12.6, -.7, 12], [-12.4, -1.8, 6.6]]] });
    babelki(); mul(); promienie(5, .2);
    const male = []; for (let i = 0; i < 9; i++) { const x0 = -17.2 + (i % 5) * .5, y0 = -.7 - Math.floor(i / 5) * .3, z0 = 5.6 + (i % 3) * .35;
      male.push(plyw(postaw(okon(.26, { lewo: i % 2 === 0 }), x0, y0, z0), { dx: .25, okres: 5, faza: i })); }
    const d1 = postaw(okon(.9, { mina: 'czujny' }), -7.4, -5.2, 6.2), d2 = plyw(postaw(okon(.8, { lewo: true }), -6, -5.5, 7.3), { dx: .2, okres: 8 });
    d1.userData.ruch = t => { const k = sm((t - 9.6) / 3.6); return { x: lerp(-7.4 + .15 * Math.sin(t * .8), -12.2, k), y: lerp(-5.2, -1.4, k) + .05 * Math.sin(t * 2) }; };
    wskaz('małe – w dużych stadach', 0, 0, 0, 60, -170, 'n', .8, 4.6); przypnij(male[2], [0, .12, 0]);
    wskaz('duże – często głębiej, pojedynczo', 0, 0, 0, -60, -170, 'z', 6, 9.6); przypnij(d1, [0, .25, 0]);
    wskaz('ale nie zawsze!', 0, 0, 0, 60, -160, 'c', 11, 15); przypnij(d1, [0, .25, 0]);
    return `<div class="chip" data-od=".2">🏆 DUŻY OKOŃ</div><div class="karta mala z" style="top:1440px" data-od="13">Łowisz same małe?<small>zmień głębokość i spróbuj większej przynęty</small></div>`;
  },
  9: () => { // RZEKA: główka → filar mostu → podmyty brzeg i kamień → granica nurtu (każde miejsce osobno, po 4–6 s)
    nowaScena({ ...LATO, seed: 21, wodaK: .042 }); swiatRzeka({ podmycia: [{ z0: -5.5, z1: 1.5, strona: -1, wysun: 1.5 }] });
    const zg = 0, xg = rzekaX(zg) + 9.4; glowka(xg, zg, 5.2, -1);
    most(-7); const xf = rzekaX(-7) + 4.5;
    for (const [x, z, sc] of [[-2, 4, 1.1], [.8, 6.5, .9], [-1.2, 9.5, 1.3]]) kamien(x, z, sc);
