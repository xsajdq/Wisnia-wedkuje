<script type="module">
import * as THREE from 'three';

const W = 1080, H = 1920;
const INK = '#241726';          // śliwkowy tusz postaci (toon.ts)

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

// ---------- pomocnicze ----------
const lerp = (a, b, t) => a + (b - a) * t;
const sm = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const rnd = (s => () => (s = (s * 16807) % 2147483647) / 2147483647);
let R = rnd(7);
const kolysz = [];   // rośliny kołyszące się w animacji
const C = h => new THREE.Color(h);

// dwutonowe cieniowanie (shade.ts w uproszczeniu): 3 progi światła
const grad = (() => { const d = new Uint8Array([90, 170, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();

// ---------- tusz świata: pass z normalnych + głębi (idea z ink.ts) ----------
const rtN = new THREE.WebGLRenderTarget(W, H, { depthTexture: new THREE.DepthTexture(W, H), samples: 0 });

const rtC = new THREE.WebGLRenderTarget(W, H, { samples: 4, type: THREE.HalfFloatType });
const normMat = new THREE.MeshNormalMaterial();
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const inkMat = new THREE.ShaderMaterial({
  uniforms: { tC: { value: rtC.texture }, tN: { value: rtN.texture }, tD: { value: rtN.depthTexture }, texel: { value: new THREE.Vector2(1 / W, 1 / H) },
    cn: { value: .1 }, cf: { value: 200 }, ink: { value: C('#060506') }, fogC: { value: C('#fff') }, fogR: { value: new THREE.Vector2(60, 200) }, vig: { value: .22 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
  fragmentShader: `
    #include <packing>
    uniform sampler2D tC, tN, tD; uniform vec2 texel; uniform float cn, cf, vig; uniform vec3 ink, fogC; uniform vec2 fogR; varying vec2 vUv;
    float Z(vec2 uv){ return -perspectiveDepthToViewZ(texture2D(tD, uv).x, cn, cf); }
    vec3 N(vec2 uv){ return texture2D(tN, uv).xyz * 2. - 1.; }
    float edge(vec2 uv, float w){
      float z0 = Z(uv); vec3 n0 = N(uv); float e = 0.;

        float z = Z(uv + o); vec3 n = N(uv + o);

    void main(){

      float e = texture2D(tD, vUv).x < 1. ? edge(vUv, w) : 0.;
      e *= 1. - smoothstep(fogR.x, fogR.y, z) * .7;
      vec3 inkc = mix(ink, fogC, smoothstep(fogR.x, fogR.y, z) * .3);
      vec3 col = mix(c.rgb, inkc, e);
      vec2 p = vUv * 2. - 1.; col *= 1. - vig * smoothstep(.55, 1.45, length(p * vec2(1., .8)));
      gl_FragColor = vec4(col, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), inkMat);
const fsScene = new THREE.Scene(); fsScene.add(fsQuad);

// ---------- karty 2D (Canvas2D, śliwkowy kontur) ----------
function karta(rysuj, cw, ch, wys) {
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round'; rysuj(g, cw, ch);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(wys * cw / ch, wys, 16, 1), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: .02, depthWrite: false, toneMapped: false }));

}
// kreskówkowy okoń z boku (głowa w prawo); design 1000×560
function rysujOkonia(g, cw, ch, o = {}) {
  const s = cw / 1000; g.save(); g.scale(s, s); if (o.lewo) { g.translate(1000, 0); g.scale(-1, 1); }
  const ol = 14;
  const ksztalt = () => { g.beginPath(); g.moveTo(905, 300);
    g.bezierCurveTo(880, 190, 760, 120, 600, 112); g.bezierCurveTo(430, 105, 300, 160, 205, 245);
    g.lineTo(150, 270); g.lineTo(150, 318);
    g.lineTo(205, 340); g.bezierCurveTo(320, 420, 470, 440, 610, 430); g.bezierCurveTo(770, 420, 885, 380, 905, 300); g.closePath(); };

  // ogon
  g.beginPath(); g.moveTo(170, 292); g.quadraticCurveTo(110, 220, 35, 165); g.quadraticCurveTo(70, 292, 35, 425); g.quadraticCurveTo(110, 365, 170, 300); g.closePath();
  g.fillStyle = '#c9a24a'; g.fill(); g.lineWidth = ol; g.strokeStyle = INK; g.stroke();
  // 1. grzbietowa kolczasta z czarną plamą
  g.beginPath(); g.moveTo(400, 132); const kol = [[420, 30], [470, 120], [500, 20], [545, 112], [575, 15], [615, 110], [650, 30], [680, 116], [700, 70], [720, 122]];
  for (const p of kol) g.lineTo(...p); g.closePath(); g.fillStyle = '#8c8a46'; g.fill(); g.lineWidth = ol; g.strokeStyle = INK; g.stroke();
  g.beginPath(); g.ellipse(668, 92, 30, 24, 0, 0, 7); g.fillStyle = INK; g.fill();
  plet([[240, 220], [255, 120], [330, 110], [370, 150]], '#a39a4c');                    // 2. grzbietowa
  // ciało
  ksztalt(); const gr = g.createLinearGradient(0, 110, 0, 435);
  gr.addColorStop(0, '#5b6b22'); gr.addColorStop(.45, '#a6b345'); gr.addColorStop(.7, '#e6dd9a'); gr.addColorStop(1, '#fbf3d6');
  g.fillStyle = gr; g.fill();
  g.save(); ksztalt(); g.clip();
  g.fillStyle = 'rgba(36,30,18,.82)';
  for (const x of [300, 395, 485, 575, 665, 745]) { g.beginPath(); g.moveTo(x - 30, 100); g.lineTo(x + 34, 100); g.lineTo(x + 10, 250); g.lineTo(x + 16, 330); g.lineTo(x - 4, 330); g.lineTo(x - 14, 250); g.closePath(); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.ellipse(620, 175, 240, 30, -.05, 0, 7); g.fill();
  g.fillStyle = 'rgba(40,20,60,.16)'; g.beginPath(); g.ellipse(560, 470, 420, 90, 0, 0, 7); g.fill();   // cień od spodu
  g.restore();
  ksztalt(); g.lineWidth = ol + 2; g.strokeStyle = INK; g.stroke();
  // pokrywa skrzelowa z kolcem
  g.beginPath(); g.moveTo(760, 160); g.quadraticCurveTo(700, 270, 760, 395); g.lineWidth = 9; g.stroke();
  g.beginPath(); g.moveTo(700, 300); g.lineTo(650, 312); g.lineTo(705, 322); g.fillStyle = INK; g.fill();
  // płetwy czerwone
  plet([[300, 405], [235, 500], [330, 470], [390, 425]], '#e5532d');                  // odbytowa
  plet([[640, 425], [600, 525], [690, 490], [720, 420]], '#e5532d');                  // brzuszna
  plet([[720, 300], [640, 345], [655, 375], [740, 330]], '#e9b04f');                  // piersiowa
  // oko (bez blasku, jak toon.ts) i pysk
  g.beginPath(); g.ellipse(822, 238, 40, 40, 0, 0, 7); g.fillStyle = '#ffd23a'; g.fill(); g.lineWidth = 10; g.strokeStyle = INK; g.stroke();
  g.beginPath(); g.ellipse(830, 240, 21, 23, 0, 0, 7); g.fillStyle = INK; g.fill();
  if (o.mina === 'zly') { g.beginPath(); g.moveTo(775, 186); g.lineTo(865, 205); g.lineWidth = 12; g.stroke(); }
  g.beginPath(); g.moveTo(905, 300); g.quadraticCurveTo(870, 325, 830, 318); g.lineWidth = 10; g.stroke();

}
const okon = (wys, o = {}) => { const m = karta((g, w, h) => rysujOkonia(g, w, h, o), 1000, 560, wys); m.userData.ryba = { kier: o.lewo ? -1 : 1, wys }; return m; };
// mała rybka-drobnica (płoć) jako ofiara
const plotka = wys => ryba(karta((g, w, h) => { const s = w / 400; g.scale(s, s);
  g.beginPath(); g.moveTo(370, 100); g.bezierCurveTo(330, 40, 200, 35, 110, 80); g.lineTo(40, 40); g.lineTo(55, 100); g.lineTo(40, 160); g.lineTo(110, 120); g.bezierCurveTo(200, 165, 330, 160, 370, 100); g.closePath();
  const gr = g.createLinearGradient(0, 40, 0, 160); gr.addColorStop(0, '#5f7f94'); gr.addColorStop(.5, '#d8e3ea'); gr.addColorStop(1, '#ffffff'); g.fillStyle = gr; g.fill();
  g.lineWidth = 10; g.strokeStyle = INK; g.stroke(); g.beginPath(); g.arc(320, 92, 15, 0, 7); g.fillStyle = '#e8392b'; g.fill(); g.lineWidth = 6; g.stroke();
  g.beginPath(); g.arc(323, 92, 7, 0, 7); g.fillStyle = INK; g.fill(); }, 400, 200, wys), 1, wys);
function ryba(m, kier, wys) { m.userData.ryba = { kier, wys }; return m; }
// wędkarz 2D (fasolowa głowa, kończyny-kreski; konstrukcja jak toon.ts, własna postać)
function wedkarz(wys, o = {}) {
  return karta((g, w, h) => { const s = w / 600; g.scale(s, s); const ol = 12;
    const bod = (f, path) => { g.beginPath(); path(); g.fillStyle = f; g.fill(); g.lineWidth = ol; g.strokeStyle = INK; g.stroke(); };
    const kurtka = o.zima ? '#d8452f' : '#3f7a4a', spodnie = o.zima ? '#2f3b5a' : '#5a4a36';
    if (o.siedzi) {

      g.lineWidth = 34; g.strokeStyle = INK; g.beginPath(); g.moveTo(250, 720); g.lineTo(330, 760); g.lineTo(330, 960); g.moveTo(290, 720); g.lineTo(390, 750); g.lineTo(400, 960); g.stroke();
      g.lineWidth = 20; g.strokeStyle = spodnie; g.beginPath(); g.moveTo(250, 720); g.lineTo(330, 760); g.lineTo(330, 950); g.moveTo(290, 720); g.lineTo(390, 750); g.lineTo(400, 950); g.stroke();
      bod('#2a2a2a', () => { g.ellipse(345, 965, 45, 20, 0, 0, 7); }); bod('#2a2a2a', () => { g.ellipse(415, 965, 45, 20, 0, 0, 7); });
    } else {
      g.lineWidth = 34; g.strokeStyle = INK; g.beginPath(); g.moveTo(260, 700); g.lineTo(240, 960); g.moveTo(330, 700); g.lineTo(350, 960); g.stroke();
      g.lineWidth = 20; g.strokeStyle = spodnie; g.beginPath(); g.moveTo(260, 700); g.lineTo(240, 950); g.moveTo(330, 700); g.lineTo(350, 950); g.stroke();
      bod('#2a2a2a', () => { g.ellipse(230, 965, 50, 20, 0, 0, 7); }); bod('#2a2a2a', () => { g.ellipse(365, 965, 50, 20, 0, 0, 7); });
    }
    // tułów-fasolka
    bod(kurtka, () => { g.moveTo(200, 470); g.bezierCurveTo(190, 390, 410, 390, 400, 470); g.lineTo(390, 720); g.bezierCurveTo(330, 750, 260, 750, 205, 720); g.closePath(); });
    g.fillStyle = 'rgba(40,20,60,.18)'; g.beginPath(); g.moveTo(330, 420); g.bezierCurveTo(390, 430, 400, 470, 392, 715); g.bezierCurveTo(360, 735, 340, 735, 330, 735); g.fill();
    // ręka z wędką
    g.lineWidth = 9; g.strokeStyle = INK; g.beginPath(); g.moveTo(400, 560); g.lineTo(590, o.siedzi ? 640 : 120); g.stroke();
    g.lineWidth = 30; g.beginPath(); g.moveTo(380, 480); g.lineTo(430, 570); g.stroke(); g.lineWidth = 18; g.strokeStyle = kurtka; g.stroke();
    g.beginPath(); g.arc(432, 575, 18, 0, 7); g.fillStyle = INK; g.fill();
    // głowa-fasola
    bod('#ffe2c2', () => { g.ellipse(300, 330, 105, 112, 0, 0, 7); });
    g.fillStyle = INK; g.beginPath(); g.ellipse(268, 330, 11, 16, 0, 0, 7); g.ellipse(332, 330, 11, 16, 0, 0, 7); g.fill();
    g.lineWidth = 8; g.beginPath(); g.moveTo(275, 385); g.quadraticCurveTo(300, 400, 325, 385); g.stroke();
    // czapka
    if (o.zima) { bod('#ffd400', () => { g.moveTo(195, 300); g.bezierCurveTo(200, 170, 400, 170, 405, 300); g.closePath(); }); bod('#fff', () => g.arc(300, 192, 30, 0, 7)); }
    else bod('#e2a63c', () => { g.moveTo(170, 290); g.lineTo(430, 290); g.lineTo(400, 255); g.bezierCurveTo(390, 170, 210, 170, 200, 255); g.closePath(); });
  }, 600, 1000, wys);
}
// strzałka-kreskówka (efekt 2D)
const strzalka = (wys, kolor = '#ffffff') => karta((g, w, h) => { const s = w / 600; g.scale(s, s);
  g.beginPath(); g.moveTo(20, 80); g.lineTo(420, 80); g.lineTo(420, 25); g.lineTo(580, 120); g.lineTo(420, 215); g.lineTo(420, 160); g.lineTo(20, 160); g.closePath();
  g.fillStyle = kolor; g.fill(); g.lineWidth = 14; g.strokeStyle = INK; g.stroke(); }, 600, 240, wys);
// wstęga ikry
const ikra = wys => karta((g, w, h) => { const s = w / 500; g.scale(s, s); R = rnd(3);
  g.lineWidth = 46; g.strokeStyle = INK; g.beginPath(); g.moveTo(30, 60); g.bezierCurveTo(160, 0, 220, 200, 320, 120); g.bezierCurveTo(400, 60, 430, 180, 480, 170); g.stroke();
  g.lineWidth = 32; g.strokeStyle = '#f5efd8'; g.stroke();
  for (let i = 0; i < 70; i++) { const t = i / 70, x = 30 + t * 450, y = 60 + Math.sin(t * 9) * 45 + 40 * t + (R() - .5) * 16; g.beginPath(); g.arc(x, y, 6, 0, 7); g.fillStyle = '#e8d9a8'; g.fill(); }
}, 500, 240, wys);

// ---------- świat ----------
let scene, camera, sun;
// świat projektuję w układzie 28×18 m, a fizycznie ściskam do 16×16 m (pion 9:16): KX, KZ
const KX = 8 / 14, KZ = 8 / 9;
function nowaScena(p) {

  const cv = document.createElement('canvas'); cv.width = 4; cv.height = 256; const g = cv.getContext('2d');

  const bg = new THREE.CanvasTexture(cv); bg.colorSpace = THREE.SRGBColorSpace; scene.background = bg;
  scene.fog = new THREE.Fog(p.mgla, p.mglaOd || 60, p.mglaDo || 220);
  camera = new THREE.PerspectiveCamera(p.fov || 34, W / H, .1, 400);
  camera.layers.enable(NOINK);
  scene.add(new THREE.HemisphereLight(p.hemiG || '#dcecff', p.hemiD || '#8a7a60', p.hemiI ?? 1.1));
  sun = new THREE.DirectionalLight(p.slonceK || '#fff3e0', p.slonceI ?? 2.6); sun.position.set(...(p.slonceP || [30, 40, 25]));

  scene.add(sun);

}
const add = (m, x = 0, y = 0, z = 0) => { m.position.set(x * KX, y, z * KZ); scene.add(m); return m; };
const cien = m => { m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; };

// diorama: blok terenu z niecką wody i przekrojem z przodu (widać, co jest pod wodą)
// h(x,z) – wysokość terenu; woda do y=0
function diorama(h, o) {
  const { sx = 14, sz = 9, dno = -7, n = 140, kolTeren, kolPod, kolBrzeg, kolDno, snieg } = o;
  const geo = new THREE.PlaneGeometry(sx * 2 * KX, sz * 2 * KZ, n, n); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, kol = [];

    const c = y > .35 ? C(kolTeren) : y > -.25 ? C(kolBrzeg) : C(kolDno).lerp(C(kolPod), sm(-y / 6));

  // ściany przekroju (przód i boki) z warstwami ziemi
  const sciana = (pts, nx, nz) => {
    const sh = []; const v = [], c = [], idx = [];
    pts.forEach(([x, z], i) => { const y = h(x, z);

// ---------- animacja ----------
const DLUGOSC = 3.6;                 // s na scenę w niemym podglądzie (w filmie: długość frazy lektora)
let numer = 1, cam0 = new THREE.Vector3();
const backOut = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
window.zbuduj = n => {
  numer = n; karty.length = 0; etykiety.length = 0; anim = []; tafle = []; kolysz.length = 0;
  const html = SCENY[n]();
  cam0.copy(camera.position); camera.updateProjectionMatrix();
  for (const k of karty) { k.userData.p0 = k.position.clone(); const g = k.geometry.attributes.position; k.userData.g0 = g.array.slice(); }
  let ht = naglowek(n) + html;
  etykiety.forEach((e, i) => { ht += `<div class="etk ${e.klasa}" id="etk${i}" data-od="${e.od}">${e.tekst}</div>`; });
  ui.innerHTML = ht;
  return DLUGOSC;
};
window.klatka = t => {
  // kamera: powolny najazd + dryf (każde ujęcie „pełznie”, jak w skillu: brak statycznych kadrów)
  const cel = camera.userData.cel, [a, b] = camera.userData.najazd, k = lerp(a, b, sm(t / DLUGOSC));
  camera.position.copy(cam0).lerp(cel, k); camera.position.x += .5 * Math.sin(t * .35);
  camera.lookAt(cel); camera.updateMatrixWorld();
  for (const m of karty) {
    const u = m.userData, p0 = u.p0; m.position.copy(p0);
    if (u.plyw) { const { dx, okres, faza, dy } = u.plyw; m.position.x += dx * KX * Math.sin(t * 2 * Math.PI / okres + faza) * .5; m.position.y += dy * Math.sin(t * 2.1 + faza); }
    if (u.wejscie) { const [od, dl, x0] = u.wejscie; m.position.x += x0 * KX * (1 - sm((t - od) / dl)); }
    if (u.nurt !== undefined) { const f = (u.nurt + t / 2.4) % 1, z = -6 + 14 * f; m.position.set(rzekaX(z) * KX, .35, z * KZ); m.material.opacity = Math.min(1, Math.min(f, 1 - f) * 6); }
    m.quaternion.copy(camera.quaternion); m.rotateZ(u.rot || 0);
    // ryby: ogon i płetwy falują (gięcie siatki karty), lekki przechył
    if (u.ryba) {
      const g = m.geometry.attributes.position, b0 = u.g0, wd = m.geometry.parameters.width, kier = u.ryba.kier;
      for (let i = 0; i < g.count; i++) { const x = b0[i * 3], s = (.5 - kier * x / wd);   // 0 przy pysku, 1 przy ogonie
        g.array[i * 3 + 1] = b0[i * 3 + 1] + u.ryba.wys * .07 * Math.pow(Math.max(0, s - .3), 2) * 3 * Math.sin(t * 9 + p0.x); }
      g.needsUpdate = true; m.rotateZ(.04 * Math.sin(t * 1.7 + p0.x));
    }
  }
  for (const [tx, vx, vy] of tafle) { tx.offset.x = t * vx; tx.offset.y = t * vy; }
  kolysz.forEach((g, i) => { g.rotation.z = .045 * Math.sin(t * 1.4 + i); g.rotation.x = .03 * Math.sin(t * 1.1 + i * 2); });
  for (const f of anim) f(t);
  // render: kolor → normalne + głębia świata (bez NOINK) → tusz + winieta
  renderer.setRenderTarget(rtC); renderer.render(scene, camera);
  const bg = scene.background, fog = scene.fog; scene.background = null; scene.fog = null; scene.overrideMaterial = normMat;
  camera.layers.disable(NOINK); renderer.setRenderTarget(rtN); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(scene, camera); camera.layers.enable(NOINK);
  scene.overrideMaterial = null; scene.background = bg; scene.fog = fog;
  inkMat.uniforms.cn.value = camera.near; inkMat.uniforms.cf.value = camera.far;
  renderer.setRenderTarget(null); renderer.render(fsScene, fsCam);
  // HTML: wejścia „pop” (sprężyna), liczniki, etykiety przypięte do świata
  for (const el of ui.querySelectorAll('[data-od]')) {
    const p = Math.max(0, Math.min(1, (t - Number(el.dataset.od)) / .35));
    el.style.opacity = String(Math.min(1, p * 3));
    const sk = p <= 0 ? .6 : backOut(p);
    if (el.classList.contains('etk')) {
      const e = etykiety[Number(el.id.slice(3))], s = e.v.clone().project(camera);
      el.style.left = (s.x + 1) / 2 * W + 'px'; el.style.top = (1 - s.y) / 2 * H + 'px';
      el.style.transform = `translate(-50%,-100%) scale(${sk})`;
    } else el.style.transform = `translateY(${(1 - p) * 40}px) scale(${.85 + .15 * sk})`;
    const lz = el.querySelector('[data-licz]'); if (lz) lz.textContent = Math.round(Number(lz.dataset.licz) * sm((t - Number(el.dataset.od)) / .8)) + ' cm';
  }
  document.getElementById('blysk').style.opacity = numer > 1 ? String(Math.max(0, 1 - t / .12)) : '0';   // biały błysk na cięciu
};
window.scena = n => { window.zbuduj(n); window.klatka(DLUGOSC - .3); };
window.gotowe = true;
</script>
