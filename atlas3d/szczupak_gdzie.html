<script type="module">
// ŚWIAT do filmu „Szczupak – gdzie i jak łowić” (scenariusz: atlas3d/scenariusze/szczupak_gdzie.md).
// Wykorzystuje świat jeziora i rzeki z filmu o okoniu (silnik, rośliny, przeszkody), ale z NOWYM układem miejsc i innymi ujęciami:
// przeloty z góry (dron), ślizg wzdłuż krawędzi roślin, orbita wokół kępy, kamera spod liści patrząca w górę, przekrój dna z boku.
// Na razie: ujęcia przeglądowe każdego miejsca (do akceptacji świata), sceny filmu dojdą po akceptacji scenariusza.
import { nowaScena, swiatJezioro, swiatRzeka, kam, trzciny, palki, grzybienie, grazele, rdestnice, rogatki, laka, zatopioneDrzewo, konar, kamien, pomost, postaw, plyw,
  szczupak, plotka, ukleja, babelki, mul, promienie, kregi, wazka, ustawObszar, glowka, most, rzekaX, brzegX, ZATOKA, nurtLinia, TEREN, LATO, uruchom } from './silnik.js';

const PX = -5;   // pomost
// ---------- JEZIORO SZCZUPAKA: płycizna z podwodną łąką na zachodzie, pas trzcin, zarośnięta zatoka, pola grzybieni i grążeli,
// pojedyncza kępa na górce na otwartej wodzie, zatopione drzewo na krawędzi płycizny, pomost z cieniem ----------
const ZAT = { a: Math.PI - .5, szer: .26, ext: .55 };   // wąska, długa zatoka na zachodnio-północnym zachodzie
// punkt przy brzegu na promieniu w kierunku a (od środka jeziora na zewnątrz): pierwsze miejsce o głębokości ≤ gl (ujemne, np. -0,5 m)
const brzeg = (a, gl = -.5) => { for (let d = 1.6; d > .3; d -= .005) { const x = Math.cos(a) * 32 * d, z = Math.sin(a) * 24 * d; if (TEREN(x, z) <= gl) return [x, z]; } return [0, 0]; };
function JEZIORO() {
  nowaScena({ ...LATO, seed: 17 }); swiatJezioro({ gorka: { x: 4, z: 6, r: 4, top: -2.2 }, zatoka: ZAT, bezKonarow: true });
  pomost(PX, -26, -3);
  // pas trzcin wzdłuż zachodniego brzegu (woda ok. 0,4 m), pałki między nimi; trzciny po obu brzegach zatoki
  for (const a of [2.86, 2.98, 3.1, 3.22, 3.34]) trzciny(...brzeg(a, -.4), 16, 1.6);
  // trzciny dookoła brzegu zatoki: punkty o głębokości 0,2–0,5 m, co najmniej 2,4 m od siebie i z dala od grzybieni
  { const [lx, lz] = brzeg(ZAT.a, -.8), pkt = [];
    for (let x = -48; x <= -26; x += .6) for (let z = 4; z <= 22; z += .6) { const t = TEREN(x, z); if (t < -.5 || t > -.2) continue;
      if (Math.hypot(x - lx, z - lz) < 2.6 || pkt.some(([a, b]) => Math.hypot(a - x, b - z) < 2.4)) continue; pkt.push([x, z]); }
    pkt.forEach(([x, z], i) => i % 4 !== 3 && trzciny(x, z, 8, .9)); }
  palki(...brzeg(3.04, -.3), 10, .9); palki(...brzeg(ZAT.a + .16, -.3), 8, .8);
  // podwodna łąka na płyciźnie, kończy się na krawędzi (spad)
  laka(-24, -4, 4.2, 18); laka(-19, -1, 4, 18); laka(-20, 5.5, 3.6, 14);
  // pola grzybieni i grążeli: przy brzegu i w głębi zatoki
  grzybienie(...brzeg(2.66, -1), 12, 3.4); grazele(...brzeg(2.5, -1.2), 6, 2.6); grzybienie(...brzeg(ZAT.a, -.8), 9, 2.4);
  // pojedyncza kępa na otwartej wodzie: na szczycie górki
  rdestnice(4, 6, 1.7); rogatki(4.8, 6.6, 1.4); rdestnice(3.3, 5.4, 1.5);
  // zatopione drzewo na krawędzi płycizny, kłoda i kamienie
  zatopioneDrzewo(-17, -10, .25, 8); konar(-12, 2, 4.5, .9); kamien(-14.5, -3, 1); kamien(-13.6, -2.2, .7);
  wazka(-28.5, .8, 2);
}
// ---------- RZEKA SZCZUPAKA: zakole, zatoka (starorzecze połączone z korytem), główka z zastoiskiem, podmyty brzeg ----------
function RZEKA() {
  nowaScena({ ...LATO, seed: 29, wodaK: .042 }); swiatRzeka({ podmycia: [{ z0: -5.5, z1: 1.5, strona: -1, wysun: 1.5 }] });
  const zg = 4, xg = rzekaX(zg) + 9.4; glowka(xg, zg, 5.2, -1);
  trzciny(ZATOKA.x - 1.5, ZATOKA.z - 1.6, 14, 1.4); grzybienie(ZATOKA.x + .2, ZATOKA.z + .2, 8, 2.2); laka(ZATOKA.x + .6, ZATOKA.z - .4, 1.6, 6);
  rdestnice(xg - 2.2, zg + 2, 1.2); rogatki(xg - 3, zg + 2.6, 1);
  nurtLinia(-12, 14, { x: -.3, y: -.35 });
}
const H1 = t => `<div class="chip miejsce" data-od=".1">📍 ${t}</div>`;
const NAD = (p, c, o = {}) => kam(p, c, { najazd: [0, .05], orbita: .06, fov: 50, ...o });
const SC = {
  // 1. widok z drona na całe jezioro: zatoka, trzciny, łąka, pomost, górka
  1: () => { JEZIORO(); kam([-12, 78, 46], [-13, 0, 0], { fov: 50, najazd: [0, .08], orbita: .04 }); return H1('jezioro – widok z góry'); },
  2: () => { JEZIORO(); kam([-24, 16, 28], [-38, 0, 13], { fov: 50, najazd: [0, .06], orbita: -.08 }); return H1('zarośnięta zatoka'); },
  3: () => { JEZIORO(); kam([-20.5, -.15, 5], [-26, -.5, -1], { stalaY: 0, fov: 52, najazd: [0, .05], orbita: .04 }); ustawObszar(-25, -1); babelki(); mul(); promienie(4);
    plyw(postaw(szczupak(.42, { mina: 'czujny', lewo: true }), -27.2, -.75, -.6), { dx: .2, okres: 9 }); return H1('pas trzcin – zasadzka'); },
  4: () => { JEZIORO(); kam([-12, -.9, 3.6], [-20, -1.1, -2], { fov: 54, najazd: [0, .06], orbita: .05 }); ustawObszar(-18, -1); babelki(); mul(); promienie(5);
    plyw(postaw(szczupak(.5, { mina: 'czujny', lewo: true }), -16, -1.2, .6), { dx: .3, okres: 10 }); return H1('krawędź podwodnej łąki'); },
  5: () => { JEZIORO(); const [gx, gz] = brzeg(2.66, -1), ix = -Math.cos(2.66), iz = -Math.sin(2.66); kam([gx + ix * 3.6, -1, gz + iz * 3.6 + 1.2], [gx + .2, -.05, gz], { fov: 60, najazd: [0, .04], orbita: .06 }); ustawObszar(gx, gz); babelki(); mul(); promienie(4);
    plyw(postaw(szczupak(.42, { mina: 'spokojny' }), gx + .7, -.6, gz + .3), { dx: .15, okres: 9 }); return H1('grzybienie od spodu'); },
  6: () => { JEZIORO(); kam([8.4, .6, 11.4], [4, -.6, 6], { stalaY: 0, fov: 50, najazd: [0, .04], orbita: .35 }); ustawObszar(4, 6); babelki(); mul(); promienie(5);
    plyw(postaw(szczupak(.48, { mina: 'czujny' }), 2.9, -1.2, 6.4), { dx: .25, okres: 9 }); return H1('pojedyncza kępa na górce'); },
  7: () => { JEZIORO(); kam([-12.6, -1.3, -3.6], [-16.5, -1.8, -9.6], { fov: 52, najazd: [0, .06], orbita: -.05 }); ustawObszar(-16, -9); babelki(); mul(); promienie(4);
    plyw(postaw(szczupak(.6, { mina: 'czujny' }), -14.6, -1.6, -8.4), { dx: .2, okres: 11 }); return H1('zatopione drzewo'); },
  8: () => { JEZIORO(); kam([PX + 3.2, -.1, -8.4], [PX - .3, -1, -13.6], { stalaY: 0, fov: 52, najazd: [0, .05], orbita: .05 }); ustawObszar(PX, -13); babelki(); mul(); promienie(4);
    plyw(postaw(szczupak(.45, { mina: 'spokojny', lewo: true }), PX + .2, -1.1, -13.2), { dx: .15, okres: 9 }); return H1('cień pomostu'); },
  9: () => { RZEKA(); kam([2, 64, 40], [0, 0, -2], { fov: 50, najazd: [0, .08], orbita: .04 }); return H1('rzeka – widok z góry'); },
  10: () => { RZEKA(); const zx = ZATOKA.x, zz = ZATOKA.z; kam([zx + 4.2, 0, zz + 5.6], [zx + .3, -.5, zz], { stalaY: 0, fov: 54, najazd: [0, .05], orbita: .05 }); ustawObszar(zx, zz); babelki(30); mul(300, '#d9cfa8'); promienie(4);
    plyw(postaw(szczupak(.42, { mina: 'czujny', lewo: true }), zx + .8, -.7, zz + .6), { dx: .2, okres: 9 }); return H1('starorzecze / zatoka'); },
  11: () => { RZEKA(); const xg = rzekaX(4) + 9.4; kam([xg - 4.8, 0, 12], [xg - 4.2, -.8, 6], { stalaY: 0, fov: 56, najazd: [0, .05], orbita: .04 }); ustawObszar(xg - 4, 6); babelki(30); mul(300, '#d9cfa8', 2.4); promienie(4);
    plyw(postaw(szczupak(.45, { mina: 'czujny', lewo: true }), xg - 3.4, -.9, 6.2), { dx: .2, okres: 9 }); return H1('za główką – granica nurtu'); },
  12: () => { RZEKA(); const xb = brzegX(-2, -1); kam([xb + 4, 0, 4.4], [xb + .2, -.4, -2], { stalaY: 0, fov: 54, najazd: [0, .05], orbita: -.05 }); ustawObszar(xb, -2); babelki(30); mul(300, '#d9cfa8', 2.4); promienie(4);
    plyw(postaw(szczupak(.42, { mina: 'czujny', lewo: true }), xb - .3, -.6, -2.2), { dx: .15, okres: 9 }); return H1('podmyty brzeg'); },
};
uruchom({ sceny: SC, liczba: 12, tytul: 'SZCZUPAK <b>ŚWIAT</b>', dlugosc: () => 4 });
</script>
