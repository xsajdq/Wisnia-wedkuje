<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Pokaz postaci 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<!-- 5 s pokazu: wszystkie ryby 3D (okoń, szczupak, płoć, ukleja) pływają, wędkarz 3D: rzut → podbijanie → hol.
     node atlas3d/render_makieta.mjs pokaz_postaci 1 --animacja --dl 5 -->
<link rel="stylesheet" href="styl3d.css">
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<div class="ui" id="ui"></div>
<script type="module">
import { sm, lerp, okon3d, szczupak, plotka3d, ukleja3d, wedkarz3d, nowaScena, swiatJezioro, pomost, postaw, etykieta, przypnij,
  babelki, mul, promienie, kregi, wazka, zylka, przedplan, kam, LATO, uruchom } from './silnik.js';
const PX = -5;
const SCENY = {
  1: () => {
    nowaScena({ ...LATO, seed: 5 }); swiatJezioro(); pomost(PX, -26, -3);
    kam([-2.4, 0, 17.5], [-4.4, -1.4, 5], { najazd: [0, .1], orbita: .1, stalaY: 0 });
    babelki(); mul(); promienie(); kregi(); wazka(-7, 1.4, 2); przedplan(3);
    // wędkarz: rzut (0–1,4 s) → podbijanie przynęty (1,4–2,6 s) → hol (od 2,6 s); pozy przechodzą płynnie
    const w = postaw(wedkarz3d(1.9), PX, .65, -3.6);
    w.userData.ruch = t => { const st = w.userData.postac.st;
      st.rzut = t < 1.4 ? t / 1.4 : undefined; st.podrywanie = t >= 1.4 && t < 2.6; st.hol = t >= 2.6;
      st.mina = t < 1.4 ? 'usmiech' : t < 2.6 ? 'skupiony' : 'zdziwiony'; return {}; };
    zylka(w, t => [lerp(-4.6, -4.1, sm(t / 1.6)) + .2 * sm((t - 2.6) / 2), -1 - .4 * sm(t / 1.4) + .15 * (t > 1.4 && t < 2.6 ? Math.max(0, Math.sin(t * 5)) ** 6 : 0) + .35 * sm((t - 2.6) / 2), 7.2], false, { typ: 'twister', dl: .45 });
    // ryby: każda płynie głową do przodu, ze stałą prędkością (bez nawrotów w 5 s)
    const lin = (m, x0, x1, y, z, faza = 0) => { m.userData.ruch = t => ({ x: lerp(x0, x1, t / 5), y: y + .06 * Math.sin(t * 1.3 + faza), z }); return m; };
    const ok = lin(postaw(okon3d(.7, { mina: 'czujny', lewo: true }), -2, -1.6, 10), -1.6, -6.4, -2.0, 10);
    const sz = lin(postaw(szczupak(.55), -7, -2.6, 11), -7.4, -2.4, -2.65, 11, 1);
    const pl = [], uk = [];
    for (let i = 0; i < 6; i++) pl.push(lin(postaw(plotka3d(.26), -9 - (i % 3) * .5, -1.1, 11.4), -7.6 - (i % 3) * .55 - i * .12, -1.6 - (i % 3) * .55 - i * .12, -.95 - (i % 2) * .2 - (i % 3) * .05, 11.8 - (i % 3) * .25, i));
    for (let i = 0; i < 7; i++) uk.push(lin(postaw(ukleja3d(.15, { lewo: true }), -1, -.45, 12), -.4 + (i % 4) * .35 + i * .08, -5.2 + (i % 4) * .35 + i * .08, -.42 - (i % 3) * .1, 12.3 - (i % 2) * .3, i * .7));
    etykieta('okoń 3D', 0, 0, 0, 'z', .3, 5); przypnij(ok, [0, .5, 0]);
    etykieta('szczupak 3D', 0, 0, 0, 'z', 2, 5); przypnij(sz, [0, -.38, 0]);
    etykieta('płocie 3D', 0, 0, 0, 'n', 1.7, 5); przypnij(pl[0], [0, .3, 0]);
    etykieta('ukleje 3D', 0, 0, 0, 'n', 1.8, 5); przypnij(uk[2], [0, .22, 0]);
    etykieta('Rzut…', PX + .25, 2.7, -3.6, 'dymek', .2, 1.4); etykieta('Jest branie!', PX + .25, 2.7, -3.6, 'dymek', 2.7, 5);
    return `<div class="chip" data-od=".1">🎬 POSTACIE 3D</div>`;
  },
};
uruchom({ sceny: SCENY, liczba: 1, tytul: 'ATLAS <b>3D</b>', dlugosc: () => 5, tlo: () => 'jezioro', kadry: [[1, 3.2]] });
</script>
</body>
</html>
